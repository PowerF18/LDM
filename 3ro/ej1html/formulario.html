<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <meta name="author" content="Santiago García" />
    <meta name="keywords" content="formulario, login" />

</head>

<body>
    <form action="formulario.html" method="get">
        <label for="login">Usuario: </label>
        <input type="text" name="login" id="login" autofocus tabindex="1" required>
        <br></br>
        <label for="contrasena">Contraseña: </label>
        <input type="password" name="contrasena" id="contrasena" tabindex="2" required>
        <br></br>
        <label for="recuerdame">Recordar usuario y contraseña</label>
        <input type="checkbox" name="recuerdame" id="recuerdame" tabindex="3">
        <br></br>
        <label for="reiniciar">Reiniciar datos</label>
        <input type="reset" value="reiniciar" tabindex="4">
        <br></br>
        <input type="submit" value="Subir">
    </form>
</body>

</html>
